<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock, Paper, Scissors ✊🖐️✌️</h1>
    <div id="score">
      <p>
        Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span> |
        Draws: <span id="draws">0</span>
      </p>
    </div>
    <div class="buttons">
      <button onclick="play('rock')" class="choice-btn">✊ Rock</button>
      <button onclick="play('paper')" class="choice-btn">🖐️ Paper</button>
      <button onclick="play('scissors')" class="choice-btn">✌️ Scissors</button>
    </div>
    <p id="result"></p>
    <script src="script.js"></script>
  </body>
</html>
